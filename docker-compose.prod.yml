services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: investment
      POSTGRES_PASSWORD: investment
      POSTGRES_DB: investment
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investment"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${ECR_REGISTRY}/investment-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql+psycopg://investment:investment@db:5432/investment
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${ECR_REGISTRY}/investment-frontend:${IMAGE_TAG:-latest}
    ports:
      - "80:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
